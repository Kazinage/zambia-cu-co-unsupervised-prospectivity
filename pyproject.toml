[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zambia-cu-co-prospectivity"
version = "0.1.0"
description = "Ensemble unsupervised prospectivity mapping from airborne geophysics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alisher Saduov"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scikit-fuzzy>=0.4.2",
  "minisom>=2.3",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]
